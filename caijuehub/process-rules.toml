# ============================================================
# 进程页裁决规则（真源）
# ============================================================
# 修改规则后运行：python3 caijuehub/transcribe.py
# 生成文件勿手改：src/caijuehub/strategies/process.strategy.rs

[ports]
# 采集哪些 socket 表
protocols = ["tcp", "tcp6", "udp", "udp6"]
# 是否只报告处于监听/绑定状态的端口
listen_only = false
# 搜索框是否匹配端口
searchable = true

[ownership]
# uid <= 该值视为系统进程（与 systemd/logind 口径一致）
system_uid_max = 999
# 父进程为该 pid 视为孤儿（被 init 收养）
orphan_parent_pid = 1
# ppid=1 但这些进程是正常的会话管理器，不算孤儿
orphan_exclude_comm = ["systemd"]

[grouping]
# none | user | app
default = "user"
order = ["user", "app"]

[icons]
# 没有匹配到 .desktop 应用时，按命令行子串指定图标（用于 IDE 拉起的 MCP/helper）
# 只写图标主题里真实存在的名字；例如装了带图标的 Qoder 后可加 "qoder" = "qoder"
commandline_icons = { "mcp-server" = "applications-development-symbolic", "mcp_server" = "applications-development-symbolic", "modelcontextprotocol" = "applications-development-symbolic", "codex" = "chatgpt", "chatgpt" = "chatgpt" }
